name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Every dependency here is pinned to a dev branch, so upstream can break
    # this repo with no push to it. A weekly run surfaces that drift instead
    # of leaving it to be found by whoever pushes next.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run redundant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, rather than stopping at the first.
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # PestWP provisions SQLite rather than MySQL, so no service container.
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl, zip
          coverage: none

      - name: Install dependencies
        # No --prefer-lowest run: the package pins dev branches, which have no
        # lowest to resolve to.
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Test
        run: composer test
